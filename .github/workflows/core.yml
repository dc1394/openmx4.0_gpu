name: C++ core
on:
  push:
  pull_request:

jobs:
  basis:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
            cc: gcc
            sanitize: "OFF"
          - os: ubuntu-24.04
            cxx: clang++
            cc: clang
            sanitize: "ON"
          - os: macos-14
            cxx: clang++
            cc: clang
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Build only the reusable basis package (no SDK or numerical stack)
        run: >-
          cmake -S modules/basis -B build/basis
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DOPENMX_BASIS_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build build/basis --parallel 2
      - name: Numerical, ownership and external consumer tests
        run: |
          ulimit -s 8192
          ctest --test-dir build/basis --output-on-failure

  xc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
            cc: gcc
            sanitize: "OFF"
          - os: ubuntu-24.04
            cxx: clang++
            cc: clang
            sanitize: "ON"
          - os: macos-14
            cxx: clang++
            cc: clang
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Build only the reusable xc package (no SDK or numerical stack)
        run: >-
          cmake -S modules/xc -B build/xc
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DOPENMX_XC_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build build/xc --parallel 2
      - name: Bitwise, analytic, derivative and external consumer tests
        run: |
          ulimit -s 8192
          ctest --test-dir build/xc --output-on-failure

  io:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
            cc: gcc
            sanitize: "OFF"
          - os: ubuntu-24.04
            cxx: clang++
            cc: clang
            sanitize: "ON"
          - os: macos-14
            cxx: clang++
            cc: clang
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Build only the reusable io package (no SDK or numerical stack)
        run: >-
          cmake -S modules/io -B build/io
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DOPENMX_IO_SANITIZERS=${{ matrix.sanitize }}
      - run: cmake --build build/io --parallel 2
      - name: Legacy-agreement, ownership and external consumer tests
        run: |
          ulimit -s 8192
          ctest --test-dir build/io --output-on-failure

  cpu-application:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [GCC, CLANG]
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU compilers and numerical libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran clang libomp-dev openmpi-bin libopenmpi-dev libscalapack-openmpi-dev libopenblas-dev libfftw3-dev autoconf automake libtool libtool-bin m4 pkg-config unzip
      - name: Build the full CPU application without a GPU SDK
        run: |
          cmake -S . -B build/cpu -DOPENMX_GPU_BACKEND=CPU -DOPENMX_CPU_COMPILER=${{ matrix.compiler }} -DOPENMX_CPU_MPI=OPENMPI -DOPENMX_CPU_LINALG=OPENBLAS -DOPENMX_COPY_TO_WORK=OFF -DOPENMX_BUILD_JOBS=2
          cmake --build build/cpu --target openmx openmx_cpu_numerics openmx_grid_assembly_tests openmx_host_simd_boundary_tests --parallel 2
      - name: Check CPU kernels and accelerator boundaries
        run: ctest --test-dir build/cpu -R '^(core-(grid-assembly|host-simd-boundary)|cpu-build-accelerator-boundary|cpu-numerical-toolchain|environment-registry)' --output-on-failure
      - name: Reject GPU runtime dependencies
        run: |
          ldd build/cpu/openmx > build/cpu/runtime-libraries.txt
          if grep -E 'not found|lib(cudart|cublas|cusolver|cuda\.so|amdhip64|rocblas|hipsolver)' build/cpu/runtime-libraries.txt; then
            exit 1
          fi

  host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: SERIAL
            standard: 20
            sanitize: "OFF"
            mpi: true
          - os: ubuntu-24.04
            backend: OPENMP
            standard: 20
            sanitize: "OFF"
          - os: ubuntu-24.04
            backend: SERIAL
            standard: 23
            sanitize: "ON"
          - os: macos-14
            backend: SERIAL
            standard: 20
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Install the AppleClang OpenMP runtime
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
      - name: Install MPI for native solver lifetime tests
        if: matrix.mpi == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev
      - name: Configure the independently buildable core
        run: >-
          cmake -S . -B build/core -DOPENMX_BUILD_APPLICATION=OFF
          -DOPENMX_CORE_BACKEND=${{ matrix.backend }}
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          -DOPENMX_CORE_SANITIZERS=${{ matrix.sanitize }}
          -DOPENMX_TEST_REQUIRE_OPENMP=ON
          -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/core --parallel 2
      - name: Inspect Darwin allocation imports
        if: runner.os == 'macOS'
        run: nm -u build/core/core/libopenmx_core.dylib | c++filt | grep -E 'operator new|operator delete'
      - name: Require native solver tests in the host-only build
        run: python3 tests/check_native_state_ctest.py --build build/core
      - name: Require real MPI lifetime coverage
        if: matrix.mpi == true
        run: python3 tests/check_native_state_ctest.py --build build/core --require-mpi
      - name: Unit tests
        env:
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: "false"
        # Failed test names go to an annotation and the step summary, which
        # are readable without the job log.
        run: |
          ulimit -s 8192
          test_status=0
          failed=""
          ctest --test-dir build/core -L '^native-state$' --no-tests=error --output-on-failure || test_status=$?
          failed="$failed $(cat build/core/Testing/Temporary/LastTestsFailed.log 2>/dev/null | tr '\n' ' ')"
          ctest --test-dir build/core -LE '^native-state(-mpi)?$' --no-tests=error --output-on-failure || test_status=$?
          failed="$failed $(cat build/core/Testing/Temporary/LastTestsFailed.log 2>/dev/null | tr '\n' ' ')"
          if [ "$test_status" -ne 0 ]; then
            echo "::error::ctest exit status $test_status; failed tests:$failed"
            {
              echo "## Failed core tests"
              echo "$failed"
              echo
              echo '```'
              tail -c 60000 build/core/Testing/Temporary/LastTest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"
      - name: Real MPI solver state cleanup
        if: matrix.mpi == true
        env:
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: "false"
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          ulimit -s 8192
          ctest --test-dir build/core -L '^native-state-mpi$' --no-tests=error --output-on-failure

  gpu-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Error, admission, scope and memory planning tests
        run: |
          ulimit -s 8192
          python3 tests/run_env_registry_cpu.py
          python3 tests/run_gpu_error_cpu.py
          python3 tests/run_gpu_workers_cpu.py
          python3 tests/run_mgpu_runtime_cpu.py
          python3 tests/run_mgpu_gemm_cpu.py
          python3 tests/run_gpu_dense_workers_cpu.py
