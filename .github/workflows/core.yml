name: C++ core
on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            backend: SERIAL
            standard: 20
            sanitize: "OFF"
          - os: ubuntu-24.04
            backend: OPENMP
            standard: 20
            sanitize: "OFF"
          - os: ubuntu-24.04
            backend: SERIAL
            standard: 23
            sanitize: "ON"
          - os: macos-14
            backend: SERIAL
            standard: 20
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Configure the independently buildable core
        run: >-
          cmake -S . -B build/core -DOPENMX_BUILD_APPLICATION=OFF
          -DOPENMX_CORE_BACKEND=${{ matrix.backend }}
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          -DOPENMX_CORE_SANITIZERS=${{ matrix.sanitize }}
          -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/core --parallel 2
      - name: Unit tests
        env:
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: "false"
        run: |
          ulimit -s 8192
          ctest --test-dir build/core --output-on-failure

  gpu-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Error, admission, scope and memory planning tests
        run: |
          ulimit -s 8192
          python3 tests/run_gpu_error_cpu.py
          python3 tests/run_gpu_workers_cpu.py
          python3 tests/run_mgpu_runtime_cpu.py
          python3 tests/run_mgpu_gemm_cpu.py
          python3 tests/run_gpu_dense_workers_cpu.py
